[build]
  publish = "site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/hub/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/arcady-mark.svg"
  status = 200
